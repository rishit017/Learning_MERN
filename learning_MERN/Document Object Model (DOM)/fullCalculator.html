<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }
    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#202124;
    }
    .container{
        width:380px;
        background:#2d2f31;
        padding:20px;
        border-radius:25px;
        box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }
    .display{
        height:100px;
        background:#303134;
        border-radius:15px;
        color:white;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:flex-end;
        padding:15px;
        margin-bottom:15px;
    }
    #expression{
        min-height:22px;
        color:#bdbdbd;
        font-size:18px;
    }
    #result{
        font-size:42px;
    }
    .buttons{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        grid-auto-rows:60px;
        gap:10px;
    }
    button{
        border:none;
        border-radius:18px;
        cursor:pointer;
        font-size:24px;
        transition:.2s;
    }
    button:hover{
        opacity:.85;
    }
    .number{
        background:#3c4043;
        color:white;
    }
    .operator,
    .clear{
        background:#5f6368;
        color:white;
    }
    .equal{
        background:#8ab4f8;
        color:black;
        font-weight:bold;
        grid-column:4;
        grid-row:3 / span 3;
    }
</style>
</head>
<body>

<div class="container">

    <div class="display">
        <div id="expression"></div>
        <div id="result">0</div>
    </div>

    <div class="buttons">

        <button class="clear">CE</button>
        <button class="operator">÷</button>
        <button class="operator">×</button>
        <button class="operator">-</button>

        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">+</button>

        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="equal">=</button>

        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>

        <button class="number">0</button>
        <button class="number">.</button>
        <button class="operator">Del</button>

    </div>

</div>

<script>
    let expression = "";
    let result = document.getElementById("result");
    let buttons = document.querySelectorAll("button");
    buttons.forEach(function(button) {
        button.addEventListener("click", function() {
            let value = button.innerHTML;
            if (value === "CE") {
                expression = "";
                result.innerHTML = "0";
            }
            else if (value === "Del") {
                expression = expression.slice(0, -1);
                if (expression === "") {
                    result.innerHTML = "0";
                } else {
                    result.innerHTML = expression;
                }
            }
            else if (value === "=") {
            let temp = expression
                .replace(/×/g, "*")
                .replace(/÷/g, "/");
            try {
                let ans = eval(temp);
                result.innerHTML = ans;
                expression = ans.toString();
            }
            catch {
                result.innerHTML = "Error";
                expression = "";
            }
        }
        else {
            expression += value;
            result.innerHTML = expression;
        }
    });
});
</script>

</body>
</html>
