<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .container{
        width:250px;
    }

    h1{ 
        text-align:center;
    }

    .counter{
        height:150px;
        background:red;
        color:white;
        font-size:50px;
        display:flex;
        justify-content:center;
        align-items:center;
        border:2px solid black;
    }

    button{
        width:100%;
        height:45px;
        margin-top:10px;
        font-size:20px;
        cursor:pointer;
    }
</style>
</head>

<body>

<div class="container">

    <h1>5 and 10</h1>

    <div class="counter" id="count">0</div>

    <button onclick="add()">+</button>
    <button onclick="subtract()">-</button>
    <button onclick="multiply()">*</button>
    <button onclick="divide()">/</button>

</div>

<script>

    let a = 5;
    let b = 10;

    function add(){
        document.getElementById("count").innerHTML = a + b;
    }

    function subtract(){
        document.getElementById("count").innerHTML = a - b;
    }

    function multiply(){
        document.getElementById("count").innerHTML = a * b;
    }

    function divide(){
        document.getElementById("count").innerHTML = a / b;
    }

</script>

</body>
</html>
