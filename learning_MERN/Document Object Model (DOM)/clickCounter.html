<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Counter</title>

<style>
    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .container{
        width:250px;
    }
    
    .counter{
        height:150px;
        background:rgb(255, 0, 0);
        color:white;
        font-size:50px;
        display:flex;
        justify-content:center;
        align-items:center;
        border-radius: 2px solid black;
    }
    
    button{
        margin-top: 10px;
        width:100%;
        height:45px;
        background-color: brown;
        font-size:18px;
        cursor:pointer;
        border-radius: 50px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="counter" id="count">0</div>
    <button onclick="increase()">Click</button>
</div>

<script>
    let count = 0;

    function increase(){
        count++;
        document.getElementById("count").innerHTML = count;
    }
</script>

</body>
</html>
